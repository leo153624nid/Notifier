services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres_notifier
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER:-notifier}
      POSTGRES_PASSWORD: ${PG_PASSWORD:-notifier}
      POSTGRES_DB: ${PG_DBNAME:-notifier}
    ports:
      - "${POSTGRES_HOST_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-notifier} -d ${PG_DBNAME:-notifier}"]
      interval: 5s
      timeout: 5s
      retries: 5

  migrate:
    build: .
    image: notifier
    container_name: notifier_migrate
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PG_HOST: postgres
      PG_PORT: 5432
      PG_USER: ${PG_USER:-notifier}
      PG_PASSWORD: ${PG_PASSWORD:-notifier}
      PG_DBNAME: ${PG_DBNAME:-notifier}
      PG_SSLMODE: ${PG_SSLMODE:-disable}
    entrypoint: ["/migrate"]
    command: ["up"]

  redis:
    image: redis:latest
    container_name: notifier_redis
    ports:
      - "${REDIS_HOST_PORT:-6379}:${RD_PORT:-6379}"
    restart: always
    # Redis используется только как cache-aside поверх Postgres (см.
    # internal/repository/cachedRepository.go) — ни один ключ не является
    # источником истины, поэтому персистентность на диск не нужна
    # (--save "" --appendonly no) и volume для /data не подключаем.
    # maxmemory + allkeys-lru — чтобы инстанс не мог вырасти без предела
    # и вытеснял наименее используемые ключи вместо падения на OOM.
    command:
      - redis-server
      - --requirepass
      - ${RD_PASSWORD:-notifier}
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
      - --save
      - ""
      - --appendonly
      - "no"
    mem_limit: 320m
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a ${RD_PASSWORD:-notifier} --no-auth-warning ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  notifier:
    build: .
    image: notifier
    container_name: notifier
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    environment:
      PORT: ${PORT:-8080}
      GRPC_PORT: ${NOTIFIER_GRPC_PORT:-9090}
      JWT_SECRET: ${JWT_SECRET:-devsecret}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      # Postgres
      # Внутри docker-сети адрес БД всегда postgres:5432 — это топология
      # compose (имя сервиса + его порт внутри сети), а не настраиваемый
      # параметр. PG_HOST/PG_PORT в .env нужны только для `make run`
      # (запуск бинарника на хосте) и здесь не используются.
      PG_HOST: postgres
      PG_PORT: 5432
      PG_USER: ${PG_USER:-notifier}
      PG_PASSWORD: ${PG_PASSWORD:-notifier}
      PG_DBNAME: ${PG_DBNAME:-notifier}
      PG_SSLMODE: ${PG_SSLMODE:-disable}
      # Redis
      RD_HOST: redis
      RD_PORT: 6379
      RD_PASSWORD: ${RD_PASSWORD:-notifier}
      # Kafka
      # Внутри docker-сети адрес брокера всегда kafka:9092 — та же
      # топология compose, что и у PG_HOST/RD_HOST выше, а не
      # настраиваемый параметр.
      KAFKA_BROKERS: kafka:9092
    ports:
      - "${APP_HOST_PORT:-8080}:${PORT:-8080}"
      - "${NOTIFIER_GRPC_HOST_PORT:-9090}:${NOTIFIER_GRPC_PORT:-9090}"

  postgres_auth:
    image: postgres:16-alpine
    container_name: postgres_auth
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${AUTH_PG_USER:-auth}
      POSTGRES_PASSWORD: ${AUTH_PG_PASSWORD:-auth}
      POSTGRES_DB: ${AUTH_PG_DBNAME:-auth}
    ports:
      - "${AUTH_POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata_auth:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${AUTH_PG_USER:-auth} -d ${AUTH_PG_DBNAME:-auth}"]
      interval: 5s
      timeout: 5s
      retries: 5

  auth_migrate:
    # Контекст — корень репозитория, а не services/auth: authservice
    # импортирует contracts/ (сгенерированный gRPC-код) через go.work,
    # а go.work требует, чтобы все перечисленные в нём модули физически
    # лежали рядом на диске в момент сборки (см. contracts/, go.work).
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    image: auth
    container_name: auth_migrate
    restart: "no"
    depends_on:
      postgres_auth:
        condition: service_healthy
    environment:
      PG_HOST: postgres_auth
      PG_PORT: 5432
      PG_USER: ${AUTH_PG_USER:-auth}
      PG_PASSWORD: ${AUTH_PG_PASSWORD:-auth}
      PG_DBNAME: ${AUTH_PG_DBNAME:-auth}
      PG_SSLMODE: ${AUTH_PG_SSLMODE:-disable}
    entrypoint: ["/migrate"]
    command: ["up"]

  auth:
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    image: auth
    container_name: auth
    restart: unless-stopped
    depends_on:
      postgres_auth:
        condition: service_healthy
      auth_migrate:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      kafka:
        condition: service_healthy
    environment:
      PORT: ${AUTH_PORT:-8081}
      NOTIFIER_GRPC_ADDR: notifier:${NOTIFIER_GRPC_PORT:-9090}
      LOG_LEVEL: ${AUTH_LOG_LEVEL:-info}
      JWT_SECRET: ${JWT_SECRET:-devsecret}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-720h}
      # Внутри docker-сети адрес БД всегда postgres_auth:5432 — см. комментарий
      # к аналогичным переменным сервиса notifier выше.
      PG_HOST: postgres_auth
      PG_PORT: 5432
      PG_USER: ${AUTH_PG_USER:-auth}
      PG_PASSWORD: ${AUTH_PG_PASSWORD:-auth}
      PG_DBNAME: ${AUTH_PG_DBNAME:-auth}
      PG_SSLMODE: ${AUTH_PG_SSLMODE:-disable}
      # Внутри docker-сети адрес брокера всегда kafka:9092 — см. комментарий
      # к аналогичной переменной сервиса notifier выше.
      KAFKA_BROKERS: kafka:9092
    ports:
      - "${AUTH_APP_HOST_PORT:-8081}:${AUTH_PORT:-8081}"

  kafka:
    image: apache/kafka:3.9.0
    container_name: notifier_kafka
    restart: unless-stopped
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # Клиент Kafka ходит к брокеру в два шага: сначала подключается к
      # адресу из bootstrap-списка, получает metadata, а потом работает с
      # тем адресом, который брокер сам про себя сообщил (advertised).
      # Поэтому слушателей два:
      #   INTERNAL (:9092) — для контейнеров в docker-сети, сообщает
      #     kafka:9092 (это имя резолвится только внутри сети compose);
      #   EXTERNAL (:19092) — для `make run` на хосте, наружу проброшен как
      #     localhost:${KAFKA_HOST_PORT} и сообщает именно этот адрес.
      # С одним слушателем хост получал в metadata kafka:9092 и падал на
      # "lookup kafka: no such host".
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:9092,EXTERNAL://0.0.0.0:19092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${KAFKA_HOST_PORT:-9092},CONTROLLER://kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      CLUSTER_ID: "notifier-dev-cluster"
      # Брокер один, а служебные топики (__consumer_offsets для consumer
      # groups, __transaction_state для транзакций) по умолчанию создаются
      # с replication factor 3. Образ apache/kafka, получив хоть одну
      # KAFKA_* переменную, собирает конфиг только из env и не берёт
      # дефолтный server.properties (где эти значения = 1), поэтому без
      # явных единиц __consumer_offsets не создаётся и consumer получает
      # "[15] Group Coordinator Not Available".
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # Не ждать 3 секунды перед первой ребалансировкой группы — в dev
      # участник всегда один.
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Топики создаёт только kafka-init (см. ниже), с нужным числом
      # партиций и replication factor. Без этой настройки брокер создал бы
      # топик сам при первой записи/подписке — с дефолтными параметрами
      # (обычно 1 партиция) — если что-то обратится к нему раньше kafka-init
      # или опечатается в имени; тогда явное создание ничего не гарантирует.
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "${KAFKA_HOST_PORT:-9092}:19092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10

  kafka-init:
    # Явное создание топиков вместо auto.create.topics.enable (выключен у
    # сервиса kafka выше) — так задаём число партиций и replication factor
    # сразу, а не то, что подставил бы брокер по умолчанию.
    #
    # Список топиков не захардкожен ни здесь, ни в scripts/kafka-init.sh —
    # его печатает бинарник /kafkatopics (cmd/kafkatopics), собранный в
    # Dockerfile.kafkainit; он берёт имена из internal/config, которая, в
    # свою очередь, берёт дефолты из contracts/events/auth/v1. Так
    # единственный источник истины об именах топиков — Go-код.
    build:
      context: .
      dockerfile: Dockerfile.kafkainit
    image: notifier-kafka-init
    container_name: notifier_kafka_init
    restart: "no"
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVER: kafka:9092

volumes:
  pgdata:
  pgdata_auth: