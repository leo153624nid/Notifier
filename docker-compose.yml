services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres_notifier
    restart: unless-stopped
    environment:
      POSTGRES_USER: notifier
      POSTGRES_PASSWORD: notifier
      POSTGRES_DB: notifier
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notifier -d notifier"]
      interval: 5s
      timeout: 5s
      retries: 5

  notifier:
    build: .
    image: notifier
    container_name: notifier
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 8080
      API_KEY: ${API_KEY:-secret}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      PG_HOST: postgres
      PG_PORT: 5432
      PG_USER: notifier
      PG_PASSWORD: notifier
      PG_DBNAME: notifier
      PG_SSLMODE: disable
    ports:
      - "8080:8080"

volumes:
  pgdata: